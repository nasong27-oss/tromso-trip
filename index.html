<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c1424">
  <title>Tromsø 2026</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tromsø">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c1424'/%3E%3Cpath d='M10 44 C22 18 42 18 54 30' stroke='%2367e8b9' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
  <script>
    /* 상단 디자인 시안 비교용: 주소 뒤에 ?hero=a | b | c | d */
    (function () { try { var m = location.search.match(/[?&]hero=([abcd])/); if (m) document.documentElement.classList.add("hv", "hv-" + m[1]); } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <!-- 큰 사진은 페이지 맨 위에서 함께 스크롤되고, 접히는 효과는 app.js 가 스크롤 위치대로 그린다.
       작은 제목 줄 + 탭 바는 사진 아래쪽 48px 에 겹쳐 있다가 맨 위에 붙는다. -->
  <header class="hero" id="hero">
    <div class="hero-sky" aria-hidden="true"></div>
    <div class="hero-shade" aria-hidden="true"></div>
    <div class="hero-inner">
      <h1 class="hero-title">Tromsø, Norway<span class="hero-glow" aria-hidden="true">Tromsø, Norway</span></h1>
      <p class="hero-lat">69° N</p>
      <p class="hero-meta" id="heroMeta"></p>
    </div>
    <div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i></div>
    <a class="hero-cue" href="#home" id="heroCue">일정 보기 ↓</a>
  </header>
  <div class="topbar" id="topbar">
    <a class="mini" href="#home" aria-label="일정으로"><span class="mini-aurora" aria-hidden="true"><i></i><i></i><i></i></span><span class="mini-title">Tromsø</span><span class="mini-meta">12/24 – 1/1</span></a>
    <nav class="tabs" id="tabs" aria-label="섹션">
      <div class="tabs-inner" role="tablist"></div>
    </nav>
  </div>
  <section class="cover-a"><h2 class="cover-title">Tromsø, Norway</h2><p class="cover-lat">69° N</p><p class="cover-meta" id="coverMeta"></p></section>

  <div class="offline-bar" id="offlineBar" hidden>오프라인 · 마지막으로 받은 내용을 보여주고 있어요</div>
  <main id="app" class="wrap" tabindex="-1"></main>
  <!-- PDF·인쇄용: 인쇄할 때만 보이는 전체 문서 (모든 탭을 이어 붙임) -->
  <div id="printDoc" class="print-doc"></div>

  <footer class="foot wrap">
    <p id="footBrand">Tromsø 2026</p>
    <div class="foot-actions">
      <button type="button" class="foot-edit" id="footA2hs">📲 홈 화면에 추가</button>
      <button type="button" class="foot-edit" id="footPrint">🖨️ PDF·인쇄</button>
      <button type="button" class="foot-edit" id="footEdit">✏️ 편집</button>
      <a href="/__logout" class="muted-link" id="logout">로그아웃</a>
    </div>
  </footer>

  <script src="/assets/data.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
